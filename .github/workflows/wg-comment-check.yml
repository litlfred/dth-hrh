# The review record (review/wg-comment): change-set records and their issues agree.
# Manual trigger only (owner decision, 2026-10-06).
#
# A thin caller: the steps are cat-harness-tools' reusable workflow, ONE
# copy for every harnessed repository (cat-harness-tools#1038), so this
# repository's CI cannot drift from smart-ra's or dth-hrh's again.
name: Wg comment — change-set records and their issues agree

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    uses: litlfred/folio-assistant-core/.github/workflows/public-comment-check.yml@cebc997cdc4e4ae9213da58aacdd38491c61650d # index.lock.json
    with:
      store: review/wg-comment
      label: wg comment
