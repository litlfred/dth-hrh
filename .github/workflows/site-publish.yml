# Site publish (by hand): stage-local.ts on a GitHub runner, from the steps
# this repository's instance declares under site.build. On main it publishes
# the gh-pages root; on any other branch, STAGING/<branch>/.
#
# A thin caller: the steps are cat-harness-tools' reusable workflow, ONE
# copy for every harnessed repository (cat-harness-tools#1038), so this
# repository's CI cannot drift from smart-ra's or dth-hrh's again.
name: Site publish (by hand)

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Only print what would run (--plan)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    uses: litlfred/cat-harness-tools/.github/workflows/folio-site-publish.yml@30b8b276e5d56fb5df0e4a78d4fb0dfe90aee409 # index.lock.json
    with:
      plan: ${{ inputs.plan }}
