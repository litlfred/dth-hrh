# Site publish: runs the agent's own `stage-local.ts` on a GitHub runner, from
# the steps this folio's instance declares under `site.build`. It runs on every
# push to main (a merged PR), and by hand.
#
# From cat-harness-tools/templates/document/. The
# steps are the platform's reusable
# litlfred/cat-harness-tools/.github/workflows/folio-site-publish.yml. On main
# it publishes the gh-pages root; on any other branch, branches/<branch>/.
# Runs queue one at a time per repository (the reusable workflow's
# concurrency group), so two quick merges publish in turn.
name: Site publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plan:
        description: "Only print what would run (--plan)"
        type: boolean
        default: false

permissions:
  contents: write
  # A preview reads the cone run's report (`preview-qa-<sha>`, an artifact of
  # the PR's `preview` checks run) to put "This change (preview)" on top of
  # its QA pages (scripts/preview-qa.ts). Granted here first: the reusable
  # workflow can only ask for it once every caller grants it.
  actions: read

jobs:
  publish:
    uses: litlfred/cat-harness-tools/.github/workflows/folio-site-publish.yml@1d779e9104cd32e101989409b427c567134c64a2 # index.lock.json
    with:
      plan: ${{ inputs.plan == true }}
