# The review record (review/wg-comment): tags, change-sets and their issues. The steps
# and the comment grammar are documented in folio-assistant-core's
# public-comment.yml. Manual trigger only (owner decision, 2026-10-06).
#
# A thin caller: the steps are cat-harness-tools' reusable workflow, ONE
# copy for every harnessed repository (cat-harness-tools#1038), so this
# repository's CI cannot drift from smart-ra's or dth-hrh's again.
name: Wg comment — tags, change-sets and their issues

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  record:
    uses: litlfred/folio-assistant-core/.github/workflows/public-comment.yml@d6bff4857770a26b82de6bc922de30d952029e85 # index.lock.json
    with:
      store: review/wg-comment
      label: wg comment
